# ============================================================
# Deploy to GitHub Pages
# Static portfolio (vanilla HTML/CSS/JS, no build step).
# Every push to `master` (or a manual run) validates the JS
# sources and publishes the repo to GitHub Pages.
# Docs: https://docs.github.com/en/pages
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Everything is data-driven, so a syntax error in any module
      # would break the whole page — catch it before deploying.
      # Same entry point as `npm run check` so the two cannot drift.
      - name: Validate JavaScript syntax
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Quoted on purpose: GitHub parses the name as an expression, and
      # an unquoted `github-pages` triggers "Value 'github-pages' is not
      # valid ... Available expression contexts: github, ...".
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
