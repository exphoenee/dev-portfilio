# ============================================================
# Deploy to GitHub Pages
# Static portfolio (vanilla HTML/CSS/JS, no build step).
# Every push to `master` (or a manual run) validates the JS
# sources and publishes the repo to GitHub Pages.
# Docs: https://docs.github.com/en/pages
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: queued runs collapse to the latest, but a
# run already in progress is allowed to finish, cancelling mid-deploy
# can leave Pages between the uploaded artifact and the finalized
# deployment. Same stance as GitHub's own Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Everything is data-driven, so a syntax error or a broken asset
      # reference would only surface in the browser, catch both before
      # deploying. Same entry points as local development, so the two
      # cannot drift. No install step: the project has zero dependencies.
      - name: Validate JavaScript syntax
        run: npm run check

      - name: Data and asset integrity tests
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Quoted on purpose: GitHub parses the name as an expression, and
      # an unquoted `github-pages` triggers "Value 'github-pages' is not
      # valid ... Available expression contexts: github, ...".
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
